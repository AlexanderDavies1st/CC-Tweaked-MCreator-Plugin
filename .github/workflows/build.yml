name: Build MCreator plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build plugin
        run: bash ./build.sh

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: cc-tweaked-mcreator-plugin
          path: build/libs/cc-tweaked-mcreator-plugin.zip
          if-no-files-found: error
          retention-days: 14
